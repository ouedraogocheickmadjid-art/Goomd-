name: Construire l'application Android (APK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du site
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clé de signature (pour que les mises à jour s'installent par-dessus)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 absent : l'APK sera signé avec une clé temporaire et ne pourra pas être installé par-dessus une version précédente."
          fi

      - name: Préparer le projet Android
        run: |
          mkdir -p app/www app/assets
          cp index.html manifest.json sw.js version.json icon-192.png icon-512.png icon-1024.png maskable-512.png apple-touch-icon.png app/www/
          cd app
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "bf.goomde.app",
            "appName": "Goomdé",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          ic = Image.open('www/icon-1024.png').convert('RGBA')
          ic.save('assets/icon-only.png')
          fg = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          s = 680
          fg.alpha_composite(ic.resize((s, s), Image.LANCZOS), ((1024 - s) // 2, (1024 - s) // 2))
          fg.save('assets/icon-foreground.png')
          bg = Image.new('RGB', (1024, 1024))
          d = ImageDraw.Draw(bg)
          for y in range(1024):
              t = y / 1023
              d.line([(0, y), (1024, y)], fill=tuple(int(a + (b - a) * t) for a, b in zip((8, 150, 250), (1, 45, 160))))
          bg.save('assets/icon-background.png')
          PY
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>#' "$M"
          V=$(python3 -c "import json;print(json.load(open('../version.json'))['v'])")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle

      - name: Construire l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Goomde.apk
          gh release create "apk-${{ github.run_number }}" Goomde.apk \
            --title "Goomdé – Android (version ${{ github.run_number }})" \
            --notes "Téléchargez Goomde.apk sur votre téléphone Android, ouvrez-le et installez-le."

      - uses: actions/upload-artifact@v4
        with:
          name: Goomde-apk
          path: Goomde.apk
